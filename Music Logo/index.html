<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Music Logo Animation</title>

    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <main class="scene">
      <div class="sound-wave wave-one"></div>
      <div class="sound-wave wave-two"></div>
      <div class="sound-wave wave-three"></div>

      <div class="headphone">
        <div class="headband"></div>

        <div class="ear left-ear">
          <div class="speaker"></div>
        </div>

        <div class="ear right-ear">
          <div class="speaker"></div>
        </div>
      </div>

      <div class="music-notes">
        <span>♪</span>
        <span>♫</span>
        <span>♪</span>
      </div>

      <h1 class="title">SOUND</h1>

      <p class="subtitle">FEEL THE FREQUENCY</p>
    </main>
  </body>
</html>
