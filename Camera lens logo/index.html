<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Camera Lens Logo Animation</title>

    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <main class="scene">
      <div class="ambient-glow"></div>

      <div class="camera-logo">
        <div class="outer-frame">
          <div class="lens">
            <div class="lens-ring">
              <div class="lens-core"></div>
            </div>

            <div class="lens-glare"></div>
          </div>

          <div class="flash"></div>
        </div>
      </div>

      <div class="brand-name">SNAP</div>

      <div class="tagline">CAPTURE THE MOMENT</div>
    </main>
  </body>
</html>
